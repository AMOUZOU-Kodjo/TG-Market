version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tg_market
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - JWT_SECRET=dev-jwt-secret-change-in-production-min-32-chars
      - JWT_REFRESH_SECRET=dev-jwt-refresh-secret-change-in-production-min-32
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: npm run dev

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tg_market
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
